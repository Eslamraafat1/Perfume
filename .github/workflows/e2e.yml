name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional: run the E2E suite against this URL (e.g. the live site) instead of a local build"
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # No Supabase secrets are needed: the E2E suite mocks every Supabase request
      # in the browser (see e2e/fixtures/supabase-mock.js).
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install app dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

      - name: Install test dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start production server
        if: ${{ !inputs.base_url }}
        run: |
          npm start > server.log 2>&1 &
          npx --yes wait-on@8.0.1 --timeout 60000 http://localhost:3000

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: ${{ inputs.base_url || 'http://localhost:3000' }}
        run: npx playwright test

      - name: Server log
        if: failure()
        run: cat server.log || true
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
